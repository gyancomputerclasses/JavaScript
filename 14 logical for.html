<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let table = 567;
        let number = 1;
        for (number; number<=10; number++){
            let multi = table * number;
            document.write(table+" * "+number+" = "+multi+"<br>");
        }
    </script>
   
</body>
</html>
