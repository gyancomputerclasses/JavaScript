<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p><b id="name"></b> is a student of <b id="institute"></b>. do course <b id="course"></b></p>
    <script>
        let name = "Sahil Kumar";
        let institute = "Gyan Computer Classes";
        let course = "Advance Diploma in Computer application.";
        document.getElementById("name").innerHTML=name;
        document.getElementById("institute").innerHTML=institute;
        document.getElementById("course").innerHTML=course;
    </script>
</body>
</html>
