<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let table = 10;
        let number = 1;
        while(number <=10){
                let multi = number* table;
                document.write(multi+"<br>");
            number++;
        }
    </script>
</body>
</html>
